<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подорожі — Контакти</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="head">
        <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" class="logo" alt="Логотип">
        <nav class="menu">
            <ul class="menu-links">
                <li class="menu-item"><a href="index.html" class="menu-item-link">Головна</a></li>
                <li class="menu-item"><a href="destinations.html" class="menu-item-link">Напрямки</a></li>
                <li class="menu-item"><a href="contact.html" class="menu-item-link">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact">
        <h2 class="contact-title">Контакти</h2>
        <form class="form" action="#">
            <label for="name" class="form-label">Ім'я:</label>
            <input type="text" id="name" class="form-input" required>

            <label for="email" class="form-label">Електронна пошта:</label>
            <input type="email" id="email" class="form-input" required>

            <label for="message" class="form-label">Повідомлення:</label>
            <textarea id="message" class="form-textarea" rows="5" required></textarea>

            <button type="submit" class="form-button">Відправити</button>
        </form>
    </section>

    <footer class="footer">
        <p class="footer-info">&copy; 2024 Подорожі. Автор: Сєміряжко. Всі права захищено.</p>
    </footer>
</body>
</html>
